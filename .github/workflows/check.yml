name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Python compile + lint
        run: |
          pip install pyflakes
          python -m py_compile $(git ls-files '*.py')
          # the OpenGL sketches use `from OpenGL.GL import *`; ignore that noise, fail on anything else
          pyflakes $(git ls-files '*.py') | grep -v "import \*' used\|defined from star imports" > lint.txt || true
          cat lint.txt; test ! -s lint.txt
      - name: JavaScript syntax
        run: for f in $(git ls-files 'field-visualizer/*.js'); do node --check "$f"; done
